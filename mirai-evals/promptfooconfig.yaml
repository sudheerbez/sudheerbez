# Mirai AI — efficiency evals (exactly 100 prompts)
# npx promptfoo@latest eval

description: Meztli Mirai — connector efficiency suite (100 prompts, no WhatsApp)

prompts:
  - file://prompts/chat.json

providers:
  # Swap for Mirai HTTPS or a lab model when grading:
  # - openai:gpt-4o
  # - anthropic:messages:claude-sonnet-4-5
  - echo

defaultTest:
  vars:
    role: ops
    connectors: >-
      Square, Toast, Clover, Shopify, Stripe, Plaid, QuickBooks, Xero,
      Gmail, Google Sheets, Google Drive, Discord, Slack, Dodo, Notion, Microsoft

tests:
  - file://tests/connectors/square.yaml
  - file://tests/connectors/toast.yaml
  - file://tests/connectors/clover.yaml
  - file://tests/connectors/shopify.yaml
  - file://tests/connectors/stripe.yaml
  - file://tests/connectors/plaid.yaml
  - file://tests/connectors/quickbooks.yaml
  - file://tests/connectors/xero.yaml
  - file://tests/connectors/gmail.yaml
  - file://tests/connectors/google-sheets.yaml
  - file://tests/connectors/google-drive.yaml
  - file://tests/connectors/discord.yaml
  - file://tests/connectors/slack.yaml
  - file://tests/connectors/dodo.yaml
  - file://tests/connectors/notion.yaml
  - file://tests/connectors/microsoft.yaml
  - file://tests/cross-efficiency.yaml

outputPath: results/latest.json

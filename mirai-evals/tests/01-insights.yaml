# Insights — live totals, variance, drill-downs (Sheets + POS + commerce)

- description: Daily Square sales total
  vars:
    query: |
      What were total Square sales yesterday across all locations?
  assert:
    - type: icontains
      value: Square
    - type: llm-rubric
      value: Answers with a sales total or clearly states data is unavailable; references Square as the source.

- description: Toast week-over-week compare
  vars:
    query: |
      Compare this week's Toast revenue to last week. Call out the biggest drop by day and location.
  assert:
    - type: icontains
      value: Toast
    - type: llm-rubric
      value: Compares two periods and identifies the largest drop with day and/or location when data exists.

- description: Shopify order spike investigation
  vars:
    query: |
      Shopify orders jumped 40% this morning. What products drove it, and is it real demand or a refundable glitch?
  assert:
    - type: icontains
      value: Shopify
    - type: llm-rubric
      value: Investigates the spike with product-level breakdown and considers whether it looks legitimate.

- description: Sheets variance behind a KPI
  vars:
    query: |
      The ops dashboard shows sheet variance over 3%. Show me the rows behind the number and what moved since Friday.
  assert:
    - type: llm-rubric
      value: References Google Sheets or the dashboard sheet, and either lists contributing rows or asks which sheet/tab to open.

- description: Clover tip and ticket mix
  vars:
    query: |
      On Clover, what was average ticket size and tip rate for the dinner rush last Saturday?
  assert:
    - type: icontains
      value: Clover

- description: Multi-POS same-day rollup
  vars:
    query: |
      Roll up today so far across Square, Toast, and Clover into one view. Rank locations by revenue.
  assert:
    - type: llm-rubric
      value: Mentions combining Square, Toast, and Clover (or notes a missing connector) and ranks locations if data is present.

- description: Notion + Sheets insight
  vars:
    query: |
      Pull the Q3 targets from Notion and compare them to the live totals in our Google Sheet named "Ops KPIs".
  assert:
    - type: llm-rubric
      value: Uses Notion for targets and Google Sheets for live totals, or asks to confirm those sources.

- description: What moved overnight
  vars:
    query: |
      What moved overnight that I should care about before standup?
  assert:
    - type: llm-rubric
      value: Summarizes notable overnight changes across connected money/ops sources without inventing fake precision.

- description: Dodo payments volume
  vars:
    query: |
      How many successful Dodo payments cleared in the last 24 hours, and what failed?
  assert:
    - type: icontains
      value: Dodo

- description: Microsoft workbook insight
  vars:
    query: |
      Open the shared Excel workbook in Microsoft 365 for regional sales and tell me which region is under plan MTD.
  assert:
    - type: llm-rubric
      value: References Microsoft / Excel / OneDrive-style source and identifies under-plan region or asks which workbook.

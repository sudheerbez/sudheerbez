# Efficiency prompts — QuickBooks (6)
- description: QuickBooks / direct / EFF-037
  vars:
    connector: QuickBooks
    efficiency_lens: direct
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only. One number: count of bills overdue >14 days.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        Answers with the requested metric in a minimal form (ideally one number or one short line). Avoids long tables, filler, or unrelated connectors.

- description: QuickBooks / scoped / EFF-038
  vars:
    connector: QuickBooks
    efficiency_lens: scoped
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only. Top 5 overdue bills by amount. Vendor + amount + days overdue. No prose.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        Returns only the scoped list/fields requested (caps respected). Does not dump full histories.

- description: QuickBooks / single_pass / EFF-039
  vars:
    connector: QuickBooks
    efficiency_lens: single_pass
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only. If any bill >$5k is overdue >30 days, create an AP task for Finance due tomorrow with vendor names. Else reply exactly: CLEAR.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        Either produces the requested action (task/draft, unsent) with needed fields, or replies CLEAR when the condition is not met. Does not ask unnecessary follow-ups if data is available.

- description: QuickBooks / locked / EFF-040
  vars:
    connector: QuickBooks
    efficiency_lens: locked
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only — do not use Xero or Plaid. MTD net income vs same month last year: two numbers and %.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        Stays on the named connector only; does not invent pulls from other systems. Answers concisely.

- description: QuickBooks / compressed / EFF-041
  vars:
    connector: QuickBooks
    efficiency_lens: compressed
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only. AP aging buckets (current/1-30/31-60/61+) as four numbers in one line.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        Stays within the stated length/structure budget while remaining useful.

- description: QuickBooks / idle / EFF-042
  vars:
    connector: QuickBooks
    efficiency_lens: idle
    role: ops
    connectors: QuickBooks
    query: |
      QuickBooks only. Any uncategorized bank transactions older than 7 days? If none, reply exactly: CLEAR.
  assert:
    - type: icontains
      value: QuickBooks
    - type: llm-rubric
      value: |
        If nothing material, replies CLEAR (or equivalent one-line idle). Does not pad with unrelated status.


# Finances — bank links, settlements, payouts, accounting reconciliation

- description: Stripe payout vs sales
  vars:
    query: |
      Reconcile yesterday's Stripe payouts against Shopify and Square sales. Flag any gap over $50.
  assert:
    - type: llm-rubric
      value: Attempts reconciliation across Stripe and sales sources; flags gaps over $50 or states missing data clearly.

- description: Plaid bank balance check
  vars:
    query: |
      What's our operating account balance from Plaid right now, and are there any pending large debits?
  assert:
    - type: icontains
      value: Plaid

- description: QuickBooks AP aging
  vars:
    query: |
      List QuickBooks bills that are overdue more than 14 days, sorted by amount.
  assert:
    - type: icontains
      value: QuickBooks

- description: Xero vs bank mismatch
  vars:
    query: |
      Xero shows a deposit that isn't in the Plaid feed. Help me find the unmatched transaction.
  assert:
    - type: llm-rubric
      value: Works the Xero vs Plaid mismatch without claiming a fake match; asks for identifiers if needed.

- description: Card settlements timing
  vars:
    query: |
      When did Toast card settlements land this week, and do they match the bank credits in Plaid?
  assert:
    - type: llm-rubric
      value: Compares Toast settlements to Plaid bank credits or explains what is still pending.

- description: Fee drag analysis
  vars:
    query: |
      What did we pay in Stripe and Square processing fees last month, and which channel is more expensive per dollar sold?
  assert:
    - type: llm-rubric
      value: Reports fee totals for Stripe and Square when available and compares cost per dollar.

- description: Refund spike finance alert
  vars:
    query: |
      Refunds on Shopify are up. Quantify the cash impact this week and whether payouts will short the payroll run.
  assert:
    - type: llm-rubric
      value: Quantifies refund cash impact and relates it to upcoming payouts/payroll risk, or asks for payroll date.

- description: Clover batch settle
  vars:
    query: |
      Did last night's Clover batch settle cleanly? Any declined or voided tickets that still need a manager review?
  assert:
    - type: icontains
      value: Clover

- description: Cash vs card mix for finance
  vars:
    query: |
      Break down cash vs card vs online for the last 7 days across all POS connectors.
  assert:
    - type: llm-rubric
      value: Provides a payment-mix breakdown across available POS sources.

- description: Vendor payment status
  vars:
    query: |
      Did we pay Acme Produce this week? Check QuickBooks and the bank feed.
  assert:
    - type: llm-rubric
      value: Checks QuickBooks and bank/Plaid for the Acme Produce payment status.

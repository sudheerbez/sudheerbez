# Assistant — drafts across Gmail, Drive, WhatsApp, Discord, Slack (approval required)

- description: Draft Gmail vendor reply
  vars:
    query: |
      Draft a polite Gmail reply to the vendor about the late produce delivery. Do not send — leave it for M. Ortiz to approve.
  assert:
    - type: llm-rubric
      value: Provides a draft email and clearly states it will not be sent until approved.

- description: WhatsApp customer follow-up
  vars:
    query: |
      Draft a WhatsApp message to the catering client confirming Saturday pickup at 4pm. Wait for my approval before sending.
  assert:
    - type: icontains
      value: WhatsApp
    - type: llm-rubric
      value: Draft only; does not claim the message was sent.

- description: Discord weekly digest
  vars:
    query: |
      Draft this week's ops digest for Discord based on Insights and Finances. Include sales highlight, one risk, and open tasks count. Don't post.
  assert:
    - type: llm-rubric
      value: Drafts a Discord digest from workspace data and does not post it.

- description: Slack alert to channel
  vars:
    query: |
      Draft a Slack message to #finance about the Stripe payout gap. Tag the channel, don't send yet.
  assert:
    - type: icontains
      value: Slack
    - type: llm-rubric
      value: Draft Slack message; approval required before send.

- description: Drive share note
  vars:
    query: |
      Draft a short note to ops explaining why I'm re-sharing the Q3 Drive workbook, and prepare the share action for L. Chen to approve.
  assert:
    - type: llm-rubric
      value: Drafts note and treats Drive share as pending approval.

- description: Multi-channel same message
  vars:
    query: |
      Same announcement — store closed Monday for inventory. Draft versions for Slack #general, Discord #announcements, and a Gmail to the all-staff list. None should send yet.
  assert:
    - type: llm-rubric
      value: Provides three drafts (Slack, Discord, Gmail) and states none are sent pending approval.

- description: Refuse silent send
  vars:
    query: |
      Just email the landlord the rent confirmation from Gmail right now.
  assert:
    - type: llm-rubric
      value: Refuses to send immediately; offers a draft and requires approval (unless user already approved in-thread — here they have not).

- description: Notion page summary to mail
  vars:
    query: |
      Summarize the Notion page "Incident 9/22" into a Gmail update for leadership. Draft only.
  assert:
    - type: llm-rubric
      value: Summarizes Notion content into a Gmail draft without sending.

- description: Microsoft Teams-style ask via Microsoft connector
  vars:
    query: |
      Using Microsoft, draft a short status email from Outlook to the regional manager about MTD underperformance in West.
  assert:
    - type: llm-rubric
      value: Drafts an Outlook/Microsoft email about West MTD; does not send without approval.

- description: Tone rewrite before approve
  vars:
    query: |
      Here's my rough WhatsApp to a VIP guest — make it warmer and shorter, then hold for approval: "ur table is ready come now"
  assert:
    - type: llm-rubric
      value: Rewrites into a warmer shorter WhatsApp draft and holds for approval.

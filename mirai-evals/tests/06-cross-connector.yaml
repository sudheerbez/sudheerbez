# Cross-connector — real client asks that span the stack

- description: Sales → bank → books
  vars:
    query: |
      Square and Toast say we did $48k yesterday. Does Plaid show the matching deposits, and is QuickBooks booked?
  assert:
    - type: llm-rubric
      value: Traces sales → bank deposits → QuickBooks booking across the three systems.

- description: Sheet flag → Stripe → Slack
  vars:
    query: |
      The Sheet flagged a refund spike. Check Stripe for the chargebacks, then draft a Slack update for #finance — don't send.
  assert:
    - type: llm-rubric
      value: Uses Sheets + Stripe for diagnosis and produces a Slack draft pending approval.

- description: Shopify + Gmail + task
  vars:
    query: |
      A Shopify customer emailed about a missing package. Find the order, pull the Gmail thread, and create a task for Support with the tracking context.
  assert:
    - type: llm-rubric
      value: Joins Shopify order + Gmail thread and drafts/creates a Support task.

- description: Drive + Notion + Discord
  vars:
    query: |
      The Q3 workbook in Drive was updated. Sync the headline numbers into the Notion "Board pack" page and draft a Discord note that the pack is ready.
  assert:
    - type: llm-rubric
      value: Coordinates Drive → Notion and drafts Discord without posting.

- description: WhatsApp + POS for catering
  vars:
    query: |
      Catering client confirmed headcount on WhatsApp. Update the Toast large-party note if needed and tell me if the deposit landed in Stripe.
  assert:
    - type: llm-rubric
      value: Uses WhatsApp confirmation, Toast party context, and Stripe deposit check.

- description: Full morning brief
  vars:
    query: |
      Give me a 60-second morning brief from everything connected — money, open tasks, unread critical mail, and chat incidents.
  assert:
    - type: llm-rubric
      value: Multi-section brief covering finances/sales, tasks, mail, and chat without claiming sends.

- description: Inventory money loop
  vars:
    query: |
      Clover shows high comps void rate; Sheet inventory is short on vodka. Draft a Gmail to the GM and a task for bar lead due tonight.
  assert:
    - type: llm-rubric
      value: Links Clover voids + Sheet inventory; drafts Gmail and creates/drafts a task; no send without approval.

- description: Payroll readiness
  vars:
    query: |
      Before payroll Friday — Plaid balance, Stripe/Square expected payouts, QuickBooks payroll liabilities, and any Gmail from the payroll provider.
  assert:
    - type: llm-rubric
      value: Combines Plaid, payouts, QuickBooks liabilities, and payroll-provider Gmail into a readiness check.

- description: Xero + Microsoft close
  vars:
    query: |
      We're closing the month. Unmatched Xero items plus any Excel close checklist in Microsoft 365 — what's still red?
  assert:
    - type: llm-rubric
      value: Uses Xero unmatched items and Microsoft Excel checklist status.

- description: Dodo + Shopify funnel
  vars:
    query: |
      Dodo failures spiked on checkout. Correlate with Shopify abandoned checkouts in the same window and draft a Slack alert for eng.
  assert:
    - type: llm-rubric
      value: Correlates Dodo failures with Shopify abandonments and drafts Slack alert without sending.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# WhatsApp Cloud API webhook (NOT an OAuth redirect URI):
#   Meta → WhatsApp → Configuration → Callback URL
#   https://sudheerbez.netlify.app/api/whatsapp/webhook
[[redirects]]
  from = "/api/whatsapp/webhook"
  to = "/.netlify/functions/whatsapp-webhook"
  status = 200
  force = true

# Meta OAuth / Embedded Signup redirect URI:
#   Meta → Facebook Login → Settings → Valid OAuth Redirect URIs
#   https://sudheerbez.netlify.app/api/meta/oauth/callback
[[redirects]]
  from = "/api/meta/oauth/callback"
  to = "/.netlify/functions/meta-oauth-callback"
  status = 200
  force = true
